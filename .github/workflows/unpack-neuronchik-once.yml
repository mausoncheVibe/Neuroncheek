name: One-time Neuronchik unpack
on:
  push:
    paths:
      - '.github/workflows/unpack-neuronchik-once.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("NEURONCHIK_1_0_GITHUB_SAFE.zip")
          expected = {
              ".gitignore", "README.md", "neuron.py", "persona.txt",
              "requirements.txt", "secrets.env.example", "settings.json",
              "tests/test_neuron.py",
          }
          with ZipFile(archive) as z:
              names = {n for n in z.namelist() if not n.endswith("/")}
              assert names == expected, f"Unexpected ZIP contents: {names ^ expected}"
              for name in sorted(expected):
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          PY
          rm -f NEURONCHIK_1_0_GITHUB_SAFE.zip
          rm -f .github/workflows/unpack-neuronchik-once.yml
      - name: Commit extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Neuronchik source files"
          git push
